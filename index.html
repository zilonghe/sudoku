<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="精美数独游戏 — 入门到大师，离线可玩" />
  <title>数独 Sudoku</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%233b82f6' rx='20' width='100' height='100'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='52' fill='white' font-family='system-ui'%3E9%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">数独</h1>
      <div class="header-stats">
        <button type="button" class="stat-chip" id="btn-pause" aria-label="暂停">
          <span class="stat-icon" id="pause-icon">⏸</span>
          <span id="timer">00:00</span>
        </button>
        <div class="stat-chip" id="mistake-chip" title="错误次数">
          <span class="stat-icon">✕</span>
          <span id="mistakes">0/3</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="toolbar">
        <div class="diff-wrap">
          <label class="sr-only" for="difficulty">难度</label>
          <select id="difficulty" aria-label="选择难度">
            <option value="easy">入门</option>
            <option value="medium" selected>中等</option>
            <option value="hard">困难</option>
            <option value="master">大师</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-new">新游戏</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>
      </div>

      <div class="controls">
        <div class="action-row">
          <button type="button" class="action-btn" id="btn-undo" aria-label="撤销">
            <span class="action-glyph">↩</span>
            <span class="action-label">撤销</span>
          </button>
          <button type="button" class="action-btn" id="btn-erase" aria-label="清除">
            <span class="action-glyph">⌫</span>
            <span class="action-label">清除</span>
          </button>
          <button type="button" class="action-btn" id="btn-notes" aria-label="笔记模式" aria-pressed="false">
            <span class="action-glyph">✎</span>
            <span class="action-label">笔记</span>
          </button>
          <button type="button" class="action-btn" id="btn-hint" aria-label="提示">
            <span class="action-glyph">💡</span>
            <span class="action-label">提示 <span id="hint-count">3</span></span>
          </button>
        </div>

        <div class="numpad" id="numpad" role="group" aria-label="数字键盘">
          <button type="button" class="num-btn" data-num="1">1</button>
          <button type="button" class="num-btn" data-num="2">2</button>
          <button type="button" class="num-btn" data-num="3">3</button>
          <button type="button" class="num-btn" data-num="4">4</button>
          <button type="button" class="num-btn" data-num="5">5</button>
          <button type="button" class="num-btn" data-num="6">6</button>
          <button type="button" class="num-btn" data-num="7">7</button>
          <button type="button" class="num-btn" data-num="8">8</button>
          <button type="button" class="num-btn" data-num="9">9</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div class="modal-overlay hidden" id="modal-pause" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="modal">
      <h2 id="pause-title">已暂停</h2>
      <p class="modal-sub">计时已暂停，点击继续回到棋盘</p>
      <button type="button" class="btn btn-primary btn-block" id="btn-resume">继续游戏</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-win" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="modal modal-celebrate">
      <div class="celebrate-emoji" aria-hidden="true">🎉</div>
      <h2 id="win-title">恭喜通关！</h2>
      <p class="modal-sub">用时 <strong id="win-time">00:00</strong></p>
      <p class="modal-meta" id="win-meta"></p>
      <button type="button" class="btn btn-primary btn-block" id="btn-win-new">再来一局</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-lose" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <div class="modal">
      <div class="celebrate-emoji" aria-hidden="true">😔</div>
      <h2 id="lose-title">游戏结束</h2>
      <p class="modal-sub">错误已达 3 次</p>
      <button type="button" class="btn btn-primary btn-block" id="btn-lose-new">重新开始</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal">
      <h2 id="confirm-title">开始新游戏？</h2>
      <p class="modal-sub">当前进度将会丢失</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-confirm-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
